name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Lint (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --verbose
      - name: Unit + integration tests
        run: cargo test --workspace --verbose
      - name: Smoke test the CLI
        shell: bash
        run: |
          BIN=target/debug/z
          [ "$RUNNER_OS" = "Windows" ] && BIN=target/debug/z.exe
          $BIN version
          $BIN doctor
          $BIN --help

      - name: Smoke test the tool runtime (offline, local registry)
        shell: bash
        run: |
          BIN=target/debug/z
          [ "$RUNNER_OS" = "Windows" ] && BIN=target/debug/z.exe
          export ZENTRION_REGISTRY_DIR="$PWD/test-registry"
          export ZENTRION_DATA_DIR="$(mktemp -d)"
          export ZENTRION_CONFIG_DIR="$(mktemp -d)"
          WORKDIR="$(mktemp -d)"; cd "$WORKDIR"
          "$OLDPWD/$BIN" platform
          "$OLDPWD/$BIN" search reference
          "$OLDPWD/$BIN" init . --name ci
          "$OLDPWD/$BIN" install hello-zen --dry-run

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true
      - name: Audit dependencies
        run: cargo audit || echo "::warning::cargo-audit reported advisories"

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for committed secrets
        run: ./scripts/check-no-secrets.sh
